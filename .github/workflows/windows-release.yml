name: Build Snapshot Crawl V4.3 for Windows
on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$PWD\browser"
          python -m playwright install chromium
      - name: Build desktop application
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$PWD\browser"
          pyinstaller --noconfirm --clean --windowed --onedir --name "Snapshot Crawl" --collect-all playwright --hidden-import lead_finder --hidden-import updater snapshot_crawl.py
      - name: Copy browser runtime
        shell: pwsh
        run: Copy-Item -Recurse -Force "browser" "dist\Snapshot Crawl\browser"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Generate installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "installer-output\Snapshot-Crawl-V4.3-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "sha256:$hash  Snapshot-Crawl-V4.3-Setup.exe" | Out-File -Encoding ascii "installer-output\SHA256SUMS.txt"
      - name: Upload V4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snapshot-Crawl-Windows-V4.3
          path: |
            installer-output/Snapshot-Crawl-V4.3-Setup.exe
            installer-output/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release for in-app updater
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-output/Snapshot-Crawl-V4.3-Setup.exe
            installer-output/SHA256SUMS.txt
          generate_release_notes: true
